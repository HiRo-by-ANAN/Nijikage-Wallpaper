[package]
name = "nijikage-wallpaper-settings"
version = "0.1.0-beta.1"
edition = "2024"
description = "Nijikage-Wallpaper settings window"
license = "GPL-3.0-or-later"
repository = "https://github.com/HiRo-by-ANAN/Nijikage-Wallpaper"
publish = false

[dependencies]
nijikage-wallpaper-core = { version = "0.1.0-beta.1", path = "../nijikage-wallpaper-core" }
eframe = "0.31"
egui = "0.31"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
rfd = "0.15"

[build-dependencies]
embed-resource = "3.0.12"
