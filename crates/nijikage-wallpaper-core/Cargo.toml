[package]
name = "nijikage-wallpaper-core"
version = "0.1.0-beta.1"
edition = "2024"
description = "Shared config, i18n and image helpers for Nijikage-Wallpaper"
license = "GPL-3.0-or-later"
repository = "https://github.com/HiRo-by-ANAN/Nijikage-Wallpaper"
publish = false

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
