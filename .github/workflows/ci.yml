name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (GNU toolchain)
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace
      - name: Unit tests (no GPU required)
        run: cargo test --release -p nijikage-wallpaper-core
      # 離屏 GPU 測試需要可用的 GPU；GitHub 託管的 runner 沒有，故只在本機執行：
      #   cargo test --release -p nijikage-wallpaper-render
